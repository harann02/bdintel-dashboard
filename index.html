return `<div class="ct">${full?'<b>'+e(c.company)+'</b>: ':''}${em}${tg}${unv}${full||!c.email?' <span style="color:#567">'+extra+'</span>':' <a href="'+e(c.source_url)+'" target="_blank" rel="noopener" style="font-size:10px">src</a>'}${full&&c.notes?'<div style="color:#777;font-size:11px">'+e(c.notes)+'</div>':''}</div>`}
function ctFor(p,name,full){return ((p.contact_map||{})[name]||[]).map(k=>CT[k]).filter(Boolean).map(c=>ctOne(c,p,name,full)).join('')||(full?`<div class="ct"><i>${e(name)}: lookup pending</i></div>`:'')}
function ctBest(p){for(const n of [p.main_contractor,p.owner]){const h=ctFor(p,n,false);if(h&&/class="mail"/.test(h))return h}return ctFor(p,p.main_contractor,false)||ctFor(p,p.owner,false)||'<i style="font-size:11px">Not publicly available</i>'}
function ctAll(p){return Object.keys(p.contact_map||{}).map(n=>ctFor(p,n,true)).join('')}
const splitTop=s=>{const o=[];let d=0,c='';for(let i=0;i<s.length;i++){const ch=s[i];if(ch=='(')d++;if(ch==')')d--;if(!d&&s.slice(i,i+2)==', '){o.push(c);c='';i++;continue}c+=ch}o.push(c);return o.map(x=>x.trim()).filter(Boolean)};
const src=p=>p.sources.map((s,i)=>`<a href="${e(s.url)}" target="_blank" rel="noopener" title="${e(s.title)}">[${i+1}]</a>`).join(' ');
function projects(){const r=filt().sort((a,b)=>{const x=a[sortK]??'',y=b[sortK]??'';return (x>y?1:x<y?-1:0)*sortD});
const cols=[['score','Score'],['priority','Pri'],['name','Project'],['location','Location'],['state','State'],['industry','Industry'],['owner','Owner'],['main_contractor','Main/EPC'],['stage','Stage'],['value','Value'],['tender_deadline','Deadline'],['recommended_action','Next action']];
return `<p>${r.length} projects (click a row for details)</p><table><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${sortK==k?(sortD>0?' \u25B2':' \u25BC'):''}</th>`).join('')}<th>Procurement contact</th><th>Src</th></tr>`+
r.map(p=>`<tr data-id="${e(p.project_id)}" style="cursor:pointer">${cols.map(([k])=>k=='priority'?`<td><span class="pill ${p.priority}">${p.priority}</span></td>`:`<td>${e(p[k])}${k=='name'&&p.flags?`<div class="flag">\u26A0 ${e(p.flags)}</div>`:''}</td>`).join('')}<td style="min-width:220px">${ctBest(p)}</td><td>${src(p)}</td></tr>`+
(open[p.project_id]?`<tr class="detail"><td colspan="14"><b>Scope:</b> ${e(p.scope)}<br><b>Services:</b> ${e(p.relevant_services)}<br><b>Subcontractors:</b> ${e(p.subcontractors)}<br><b>Dates:</b> ${e(p.start_date)} \u2192 ${e(p.end_date)} | award ${e(p.award_date)}<br><b>Tender:</b> ${e(p.tender_status)} | reg: ${e(p.tender_registration)}<br><b>Contacts (public):</b> ${e(p.contacts)}<br><b>Procurement / vendor contacts:</b>${ctAll(p)}<b>Confirmed vs inferred:</b> ${e(p.confirmed_vs_inferred)}<br><b>Score breakdown:</b> ${Object.entries(p.score_breakdown).map(([k,v])=>k+' '+v).join(', ')}<br><b>Rationale:</b> ${e(p.rationale)}<br><b>First seen:</b> ${e(p.first_discovered)} | last verified ${e(p.last_verified)} | follow-up: ${e(p.follow_up_status)}<br>${p.sources.map(s=>`<a href="${e(s.url)}" target="_blank" rel="noopener">${e(s.title||s.url)}</a>`).join('<br>')}</td></tr>`:'')).join('')+'</table>'}
function directory(){const m={};filt().forEach(p=>{[['Client/Owner',p.owner],['Main/EPC',p.main_contractor]].concat(splitTop(p.subcontractors||'').map(s=>['Subcontractor',s])).forEach(([role,n])=>{if(!n||/^Not publicly|^Unverified/.test(n))return;const k=role+'|'+n;(m[k]=m[k]||{role,n,ps:[]}).ps.push(p)})});
return '<table><tr><th>Role</th><th>Company</th><th>Procurement / vendor contact</th><th>#</th><th>Projects</th></tr>'+Object.values(m).sort((a,b)=>b.ps.length-a.ps.length).map(x=>`<tr><td>${x.role}</td><td>${e(x.n)}</td><td style="min-width:260px">${ctFor(x.ps[0],x.n,true)}</td><td>${x.ps.length}</td><td>${x.ps.map(p=>`${e(p.name)} <span class="pill ${p.priority}">${p.priority}</span> ${src(p)}`).join('<br>')}</td></tr>`).join('')+'</table>'}
function timeline(){const ev=[];P.forEach(p=>[['award_date','Awarded'],['tender_deadline','Tender deadline'],['start_date','Start'],['end_date','End/COD']].forEach(([k,l])=>{if(days(p[k])!==null)ev.push({d:p[k].slice(0,10),l,p})}));ev.sort((a,b)=>a.d<b.d?-1:1);
return '<h3>Project timeline</h3><table><tr><th>Date</th><th>Event</th><th>Project</th><th>In</th></tr>'+ev.map(x=>`<tr${days(x.d)<0?' style="color:#888"':''}><td>${x.d}</td><td>${x.l}</td><td>${e(x.p.name)} ${src(x.p)}</td><td>${days(x.d)}d</td></tr>`).join('')+'</table><h3>Activity log</h3><table><tr><th>When</th><th>Type</th><th>Project</th><th>Field</th><th>Old \u2192 New</th></tr>'+DATA.history.map(h=>`<tr><td>${e(h.changed_at)}</td><td>${e(h.change_type)}</td><td>${e(h.name)}</td><td>${e(h.field)}</td><td>${e(h.old_value)} \u2192 ${e(h.new_value)}</td></tr>`).join('')+'</table>'}
function alerts(){return '<ul class="alerts">'+DATA.alerts.map(a=>`<li>${e(a)}</li>`).join('')+'</ul>'}
function render(){$('#view').innerHTML={projects,directory,timeline,alerts}[tab]()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});
document.querySelectorAll('#filters select,#filters input').forEach(x=>x.oninput=render);
$('#view').onclick=ev=>{const cb=ev.target.closest('button.cp');if(cb){ev.stopPropagation();const v=cb.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{cb.textContent='copied!'},()=>{prompt('Copy email:',v)});setTimeout(()=>cb.textContent='copy email',1500);return}const th=ev.target.closest('th[data-k]');if(th){const k=th.dataset.k;sortD=sortK==k?-sortD:-1;sortK=k;return render()}
const tr=ev.target.closest('tr[data-id]');if(tr&&!ev.target.closest('a,button')){open[tr.dataset.id]=!open[tr.dataset.id];render()}};
render();
</script></body></html>
